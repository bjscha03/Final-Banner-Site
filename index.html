    <meta charset="UTF-8" />

    <!-- Preconnect hints - MUST be first after meta tags -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://connect.facebook.net">
    <link rel="dns-prefetch" href="https://t.contentsquare.net">
    <link rel="dns-prefetch" href="https://d64gsuwffb70l.cloudfront.net">
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="dns-prefetch" href="https://res.cloudinary.com">

    <!-- Discover route-specific hero art before the React bundle executes. -->
    <script>
      (() => {
        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.type = 'image/avif';
        preload.fetchPriority = 'high';

        if (window.location.pathname === '/') {
          preload.href = window.matchMedia('(max-width: 639px)').matches
            ? '/images/homepage/school-hero-mobile.avif'
            : '/images/homepage/school-hero-desktop.avif';
        } else if (window.location.pathname === '/google-ads-banner') {
          preload.href = '/images/google-ads/banner-collage-1040.avif';
          preload.imageSrcset = '/images/google-ads/banner-collage-520.avif 520w, /images/google-ads/banner-collage-800.avif 800w, /images/google-ads/banner-collage-1040.avif 1040w';
          preload.imageSizes = '(min-width: 1280px) 57vw, 100vw';
        } else if (['/vinyl-banners', '/yard-signs', '/car-magnets'].includes(window.location.pathname)) {
          const slug = window.location.pathname.slice(1);
          const mobile = window.matchMedia('(max-width: 1023px)').matches;
          preload.href = mobile
            ? `/images/product-heroes/${slug}-mobile-640.avif`
            : `/images/product-heroes/${slug}-1100.avif`;
          preload.imageSrcset = mobile
            ? `/images/product-heroes/${slug}-mobile-640.avif 640w`
            : `/images/product-heroes/${slug}-720.avif 720w, /images/product-heroes/${slug}-1100.avif 1100w`;
          preload.imageSizes = mobile ? '100vw' : '61vw';
        } else if (window.location.pathname === '/design') {
          const requested = new URLSearchParams(window.location.search).get('product');
          const slug = requested === 'yard-sign' || requested === 'yard_sign' || requested === 'yard-signs'
            ? 'yard-signs'
            : requested === 'car-magnet' || requested === 'car_magnet' || requested === 'car-magnets'
              ? 'car-magnets'
              : 'vinyl-banners';
          const directory = slug === 'vinyl-banners' ? 'design-heroes' : 'product-heroes';
          const mobile = window.matchMedia('(max-width: 1023px)').matches;
          preload.href = mobile
            ? `/images/${directory}/${slug}-mobile-640.avif`
            : `/images/${directory}/${slug}-1100.avif`;
          preload.imageSrcset = mobile
            ? `/images/${directory}/${slug}-mobile-640.avif 640w`
            : `/images/${directory}/${slug}-720.avif 720w, /images/${directory}/${slug}-1100.avif 1100w`;
          preload.imageSizes = mobile ? '100vw' : '62vw';
        } else {
          return;
        }

        document.head.appendChild(preload);
      })();
    </script>

    <!-- Critical CSS - inline for immediate rendering -->
    <style>
      /* Critical above-the-fold styles */
      *,::before,::after{box-sizing:border-box;border:0 solid #e5e7eb}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji"}
      body{margin:0;line-height:inherit}
      h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
      a{color:inherit;text-decoration:inherit}
      img,video{max-width:100%;height:auto}
      button{background-color:transparent;cursor:pointer}
      
      /* Loading state */
      #root:empty::after{content:"";position:fixed;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border:3px solid #e5e7eb;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      
      /* Critical layout classes */
      .min-h-screen{min-height:100vh}
      .flex{display:flex}
      .flex-col{flex-direction:column}
      .items-center{align-items:center}
      .justify-center{justify-content:center}
      .text-center{text-align:center}
      .font-bold{font-weight:700}
      .text-4xl{font-size:2.25rem;line-height:2.5rem}
      .text-5xl{font-size:3rem;line-height:1}
      .text-6xl{font-size:3.75rem;line-height:1}
      .leading-tight{line-height:1.25}
      .bg-white{background-color:#fff}
      .text-gray-500{color:#6b7280}
      
      @media(min-width:768px){.md\:text-5xl{font-size:3rem;line-height:1}}
      @media(min-width:1024px){.lg\:text-6xl{font-size:3.75rem;line-height:1}}
    </style>
