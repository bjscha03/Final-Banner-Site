<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Celebration responsive preview</title><style>*{box-sizing:border-box}body{margin:0;background:#dfe5ee;font:15px Arial;color:#102347}header{padding:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}select{padding:10px}iframe{display:block;width:390px;max-width:100%;height:844px;margin:auto;border:0;background:white}p{margin:0}</style></head><body><header><strong>Celebration test — no purchase needed</strong><label>Screen size <select id="size"><option value="320,568">Small phone · 320px</option><option value="390,844" selected>Phone · 390px</option><option value="844,390">Landscape phone</option><option value="1200,800">Desktop</option></select></label><p>Use Test celebration inside the preview. Sound is off by default.</p></header><iframe id="preview" src="/order-celebration.html" title="Celebration preview"></iframe><script>document.getElementById('size').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');const frame=document.getElementById('preview');frame.style.width=w+'px';frame.style.height=h+'px';});</script></body></html>
