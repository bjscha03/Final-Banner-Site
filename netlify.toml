# Preview/branch deploy crawler protection
[context.deploy-preview]
  command = "npm run build"

[context.deploy-preview.environment]
  # Reuse the site's existing AI flag name so Lambda-compatible functions do
  # not exceed AWS's 4 KB aggregate environment-variable limit. The server
  # additionally requires Netlify's deploy-preview CONTEXT before enabling.
  VITE_AI_BANNER_ENABLED = "true"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
  X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"

[[context.deploy-preview.redirects]]
  from = "/robots.txt"
  to = "/robots-preview.txt"
  status = 200
  force = true

[context.branch-deploy]
  command = "npm run build"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
  X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"

[[context.branch-deploy.redirects]]
  from = "/robots.txt"
  to = "/robots-preview.txt"
  status = 200
  force = true
