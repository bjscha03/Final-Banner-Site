# Generated product/city pages are physical files and therefore shadow these
# non-forced rules. Unknown child paths receive a true HTTP 404.
[[redirects]]
  from = "/vinyl-banners/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/yard-signs/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/car-magnets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/trade-shows/*"
  to = "/404.html"
  status = 404

# Existing hashed assets shadow this non-forced rule. Missing/stale chunks must
# never be rewritten to index.html with JavaScript cache headers.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA fallback (must be last redirect) - exclude static assets
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ==========================================
# CACHE HEADERS FOR PERFORMANCE
# ==========================================

# JavaScript and CSS bundles - long cache with immutable (cache-busted filenames)
[[headers]]
  for = "/assets/*.js"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Images - long cache
[[headers]]
  for = "/images/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Fonts - long cache
[[headers]]
  for = "/*.woff"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# HTML - short cache for updates
[[headers]]
  for = "/"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# Private, transactional, admin, and diagnostic SPA routes must never enter a
# search index. The response header is authoritative even when a crawler does
# not execute the client-side robots policy.
[[headers]]
  for = "/admin"
  [headers.values]
  X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"

