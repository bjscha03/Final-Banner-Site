[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"


[functions]
  directory = "netlify/functions"
  # The ESM entrypoints load shared CommonJS handlers that require Neon at
  # runtime. Keep esbuild for the wrappers, and have Netlify copy Neon into
  # each consuming function artifact instead of relying on esbuild to inline
  # transitive CJS requires. The explicit included_files entries are required
  # because runtime requires live inside copied legacy handlers and are not
  # always visible to Netlify's wrapper dependency analysis.
  node_bundler = "esbuild"
  included_files = ["src/lib/**", "src/emails/**", "public/images/email/mockup-scenes/**", "node_modules/pdfjs-dist/standard_fonts/LiberationSans-Bold.ttf", "node_modules/fontkit/**", "node_modules/@swc/helpers/**", "node_modules/base64-js/**", "node_modules/brotli/**", "node_modules/clone/**", "node_modules/dfa/**", "node_modules/fast-deep-equal/**", "node_modules/pako/**", "node_modules/restructure/**", "node_modules/tiny-inflate/**", "node_modules/tslib/**", "node_modules/unicode-properties/**", "node_modules/unicode-trie/**", "node_modules/@neondatabase/serverless/**", "node_modules/node-fetch/**", "node_modules/whatwg-url/**", "node_modules/tr46/**", "node_modules/webidl-conversions/**", "node_modules/resend/**"]
  external_node_modules = ["@neondatabase/serverless", "node-fetch", "@react-email/components", "@react-email/render", "aws-sdk", "uuid", "cloudinary", "sharp", "pdfkit", "openai", "google-auth-library", "stripe"]

# Function-specific configuration
[functions."upload-file"]
  timeout = 60
  memory = 1008

[functions."canva-export"]
  timeout = 60
  memory = 1008

[functions."render-order-pdf"]
  timeout = 120
  memory = 2048

[functions."process-paid-order-followups-background"]
  memory = 2048

[functions."download-print-pdf"]
  timeout = 120
  memory = 2048

[functions."ai-generate-banner"]
  timeout = 120
  memory = 1024

[functions."generate-design"]
  timeout = 60
  memory = 1024

[functions."ai-preview-image"]
  timeout = 60
  memory = 1024

[functions."ai-designer-generate"]
  memory = 2048

[functions."ai-designer-edit"]
  memory = 2048

[functions."ai-designer-worker-background"]
  background = true
  memory = 2048

[functions."ai-designer-job"]
  memory = 512

[functions."ai-designer-status"]
  timeout = 30
  memory = 512

[functions."ai-designer-brief"]
  timeout = 30
  memory = 512

[functions."outbound-sales-manual-review"]
  timeout = 60
  memory = 1024

[functions."outbound-sales-manual-artwork"]
  timeout = 60
  memory = 1024

[functions."ai-designer-cleanup"]
  schedule = "@daily"
  timeout = 60
  memory = 512

# Manual-sales preparation only. These jobs discover/research leads and prepare
# email drafts; they never create artwork, call Resend, or send email. Netlify cron is UTC, so the
# The 11:00 UTC finalizer and 11:30 UTC retry both finish before 8:00 AM
# Eastern year-round, while leaving time to finalize partial progress safely.
[functions."outbound-sales-morning-launch"]
  schedule = "30 9 * * *"
  timeout = 30
  memory = 512

[functions."outbound-sales-morning-replenish"]
  schedule = "30 10 * * *"
  timeout = 30
  memory = 512

[functions."outbound-sales-morning-finalize"]
  schedule = "0 11 * * *"
  timeout = 30
  memory = 512

[functions."outbound-sales-morning-finalize-retry"]
  schedule = "30 11 * * *"
  timeout = 30
  memory = 512

[functions."outbound-sales-morning-prepare-background"]
  background = true
  memory = 2048

# Admin/token-triggered Atlanta event import and resumable lead preparation.
# Both endpoints are preparation-only; neither endpoint imports delivery code.
[functions."outbound-sales-event-import"]
  timeout = 30
  memory = 512

[functions."outbound-sales-event-import-background"]
  background = true
  memory = 2048


[dev]
  targetPort = 8080
  port = 8888
  publish = "dist"
  autoLaunch = false

# Force HTTPS (belt & suspenders)
[[redirects]]
  from = "http://*bannersonthefly.com/*"
  to = "https://bannersonthefly.com/:splat"
  status = 301
  force = true

# Canonical: www -> apex
[[redirects]]
  from = "https://www.bannersonthefly.com/*"
  to = "https://bannersonthefly.com/:splat"
  status = 301
  force = true

# Retired seasonal campaign. Keep old indexed/bookmarked URLs away from the
# removed checkout and proof flows while preserving a useful customer landing.
[[redirects]]
