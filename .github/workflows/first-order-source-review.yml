name: First order source review
on:
  push:
    branches: ['feat/automatic-first-order-discount']
    paths: ['.github/workflows/first-order-source-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Package source text for review
        run: |
          git archive --format=zip HEAD src netlify/functions tests scripts package.json package-lock.json vite.config.ts vitest.ai.config.ts tsconfig.json tsconfig.app.json tailwind.config.ts playwright.preview.config.ts playwright.shipping-benefits.config.ts .github/workflows/shipping-benefit-badges.yml > /tmp/bof-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bof-first-order-source
          path: /tmp/bof-source.zip
          retention-days: 1
