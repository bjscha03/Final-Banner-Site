name: Diagnose Final PayPal Live Deploy

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-final-paypal-live.yml'

permissions:
  contents: read

jobs:
  diagnose-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report current production checkout and PayPal config
        shell: bash
        run: |
          set -u

          config_file="$(mktemp)"
          config_status="$({ curl --silent --show-error --location \
            --output "${config_file}" \
            --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache, no-store, must-revalidate' \
            "https://bannersonthefly.com/.netlify/functions/paypal-config?diagnostic=${GITHUB_RUN_ID}"; } || true)"

          echo "paypal-config HTTP status: ${config_status}"
          if [[ "${config_status}" == '200' ]]; then
            CONFIG_FILE="${config_file}" node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.env.CONFIG_FILE,'utf8'));console.log('paypal-config summary: '+JSON.stringify({enabled:p.enabled,environment:p.environment,components:p.components,fastlane:p.fastlane,clientIdPresent:typeof p.clientId==='string'&&p.clientId.length>0,clientTokenPresent:Object.prototype.hasOwnProperty.call(p,'clientToken')}));"
          else
            echo 'paypal-config body:'
            cat "${config_file}" || true
          fi

          html_file="$(mktemp)"
          bundle_file="$(mktemp)"
          checkout_status="$({ curl --silent --show-error --location \
            --output "${html_file}" \
            --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache, no-store, must-revalidate' \
            "https://bannersonthefly.com/checkout?diagnostic=${GITHUB_RUN_ID}"; } || true)"
          echo "checkout HTTP status: ${checkout_status}"

          mapfile -t initial_assets < <(
            grep -oE 'src="[^"]+\.js[^"]*"' "${html_file}" \
              | sed -E 's/^src="//; s/"$//' \
              | sed -E 's/[?].*$//' \
              | sort -u \
              || true
          )
          printf 'initial checkout assets: %s\n' "${initial_assets[*]:-none}"

          declare -A seen=()
          queue=("${initial_assets[@]:-}")
          all_assets=()

          for depth in 1 2 3 4; do
            next_queue=()
            for asset_path in "${queue[@]:-}"; do
              [[ -z "${asset_path}" ]] && continue

              if [[ "${asset_path}" == http* ]]; then
                asset_url="${asset_path}"
                normalized_path="${asset_path}"
              else
                [[ "${asset_path}" != /* ]] && asset_path="/${asset_path}"
                asset_url="https://bannersonthefly.com${asset_path}"
                normalized_path="${asset_path}"
              fi

              [[ -n "${seen[${normalized_path}]:-}" ]] && continue
              seen["${normalized_path}"]=1
              all_assets+=("${normalized_path}")

              asset_file="$(mktemp)"
              separator='?'
              [[ "${asset_url}" == *'?'* ]] && separator='&'
              curl --silent --show-error --location \
                -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                "${asset_url}${separator}diagnostic=${GITHUB_RUN_ID}-${depth}" \
                --output "${asset_file}" || true
              cat "${asset_file}" >> "${bundle_file}"

              while IFS= read -r ref; do
                [[ -z "${ref}" ]] && continue
                case "${ref}" in
                  ./*) candidate="/assets/${ref#./}" ;;
                  /assets/*) candidate="${ref}" ;;
                  assets/*) candidate="/${ref}" ;;
                  *) continue ;;
                esac
                [[ -z "${seen[${candidate}]:-}" ]] && next_queue+=("${candidate}")
              done < <(
                grep -oE '(\./|/assets/|assets/)[A-Za-z0-9._-]+\.js' "${asset_file}" \
                  | sort -u \
                  || true
              )
              rm -f "${asset_file}"
            done
            queue=("${next_queue[@]:-}")
            [[ ${#queue[@]} -eq 0 ]] && break
          done

          printf 'scanned checkout assets: %s\n' "${all_assets[*]:-none}"
          grep -Fq 'bof-paypal-checkout-v5:' "${bundle_file}" && echo 'checkout-v5 marker: present' || echo 'checkout-v5 marker: missing'
          grep -Fq 'Check payment status' "${bundle_file}" && echo 'payment-status marker: present' || echo 'payment-status marker: missing'
          grep -Fq 'Pay securely by card or PayPal. No PayPal account required.' "${bundle_file}" && echo 'hosted-buttons marker: present' || echo 'hosted-buttons marker: missing'

          status_endpoint="$({ curl --silent --show-error --location \
            --output /dev/null \
            --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            'https://bannersonthefly.com/.netlify/functions/paypal-payment-status'; } || true)"
          echo "payment-status empty-request HTTP status: ${status_endpoint}"

          background_endpoint="$({ curl --silent --show-error --location \
            --output /dev/null \
            --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H 'X-Internal-Job-Secret: intentionally-invalid-production-diagnostic' \
            --data '{"orderId":"production-diagnostic-no-op"}' \
            'https://bannersonthefly.com/.netlify/functions/process-paid-order-followups-background'; } || true)"
          echo "background function HTTP status: ${background_endpoint}"
