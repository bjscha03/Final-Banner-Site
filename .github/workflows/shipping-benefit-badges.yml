name: Shipping benefit badges
on:
  pull_request:
    paths:
      - 'src/components/pricing/**'
      - 'src/components/design/MobileSubtotalBar*'
      - 'tests/browser/shipping-benefit-badge.playwright.spec.ts'
      - 'playwright.shipping-benefits.config.ts'
      - '.github/workflows/shipping-benefit-badges.yml'
permissions:
  contents: read
jobs:
  shipping-benefits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Restore declared optional native metadata in the QA checkout
        # Existing lock metadata marks foreign-platform Rollup/fsevents
        # packages as required. Only restore packages that their parents
        # explicitly declare optional. Versions/integrity hashes stay fixed;
        # this disposable checkout does not change the production lockfile.
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = Object.entries(lock.packages || {});
          const optionalNames = new Set(packages.flatMap(([, pkg]) => Object.keys(pkg.optionalDependencies || {})));
          let repaired = 0;
          for (const [path, pkg] of packages) {
            const name = path.slice(path.lastIndexOf('node_modules/') + 'node_modules/'.length);
            if ((pkg.os || pkg.cpu) && optionalNames.has(name) && pkg.optional !== true) {
              pkg.optional = true;
              repaired++;
            }
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          console.log(`Restored optional metadata on ${repaired} declared optional native packages.`);
          NODE
      - run: npm ci
      - name: Verify price and shipping display regressions
        run: npx vitest run src/components/pricing src/components/design/MobileSubtotalBar.test.tsx
      - name: Build the existing production application
        run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify shipping badges, safe area and cart buttons at 320 to 1440 pixels
        run: npx playwright test --config=playwright.shipping-benefits.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipping-benefit-browser-results
          path: test-results/
          retention-days: 7
