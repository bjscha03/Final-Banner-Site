name: Shipping benefit badges
on:
  pull_request:
    paths:
      - 'src/components/pricing/**'
      - 'src/components/design/MobileSubtotalBar*'
      - 'tests/browser/shipping-benefit-badge.playwright.spec.ts'
      - 'playwright.shipping-benefits.config.ts'
      - '.github/workflows/shipping-benefit-badges.yml'
permissions:
  contents: read
jobs:
  shipping-benefits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Restore optional native Rollup metadata in the QA checkout
        # The existing lockfile marks foreign-platform Rollup binaries as
        # required. Keep every locked version and integrity hash unchanged;
        # repair only optional platform metadata in this disposable checkout.
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          let repaired = 0;
          for (const [path, pkg] of Object.entries(lock.packages || {})) {
            if (/(?:^|\/)node_modules\/@rollup\/rollup-/.test(path) && (pkg.os || pkg.cpu) && pkg.optional !== true) {
              pkg.optional = true;
              repaired++;
            }
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          console.log(`Restored optional metadata on ${repaired} platform-specific Rollup packages.`);
          NODE
      - run: npm ci
      - name: Verify price and shipping display regressions
        run: npx vitest run src/components/pricing src/components/design/MobileSubtotalBar.test.tsx
      - name: Build the existing production application
        run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify shipping badges, safe area and cart buttons at 320 to 1440 pixels
        run: npx playwright test --config=playwright.shipping-benefits.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipping-benefit-browser-results
          path: test-results/
          retention-days: 7
