name: Approved checkout redesign checks
on:
  pull_request:
    paths:
      - 'src/components/checkout/**'
      - 'src/components/delivery/PriceDeliveryEstimate.tsx'
      - 'src/components/Layout.tsx'
      - 'src/pages/Checkout*'
      - 'src/styles/checkout.css'
      - 'tests/browser/*checkout*'
      - 'tests/browser/checkout*'
      - 'playwright.checkout.config.ts'
      - '.github/workflows/checkout-redesign.yml'
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Restore declared optional native metadata in the QA checkout
        # Existing lock metadata marks foreign-platform Rollup/fsevents
        # packages as required. Only restore packages that their parents
        # explicitly declare optional. Versions/integrity hashes stay fixed;
        # this disposable checkout does not change the production lockfile.
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = Object.entries(lock.packages || {});
          const optionalNames = new Set(packages.flatMap(([, pkg]) => Object.keys(pkg.optionalDependencies || {})));
          let repaired = 0;
          for (const [path, pkg] of packages) {
            const name = path.slice(path.lastIndexOf('node_modules/') + 'node_modules/'.length);
            if ((pkg.os || pkg.cpu) && optionalNames.has(name) && pkg.optional !== true) {
              pkg.optional = true;
              repaired++;
            }
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          console.log(`Restored optional metadata on ${repaired} declared optional native packages.`);
          NODE
      - run: npm ci
      - name: Payment state, recovery, customer drafts and authoritative totals
        run: npx vitest run src/pages/Checkout.layout.test.ts src/pages/Checkout.paymentIntegrity.test.ts src/components/checkout src/components/Layout.checkout.test.tsx
      - name: Backend payment and pricing regressions
        run: node --test netlify/functions/__tests__/stripe-checkout-service.test.cjs netlify/functions/__tests__/payment-discount-reservation.test.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Desktop and mobile layout, card validation, provider switching and promo totals
        run: npx playwright test --config=playwright.checkout.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-redesign-screenshots
          path: test-results/
          retention-days: 7
      - name: Existing PayPal form and real artwork handoff regressions
        run: npx playwright test --config=playwright.preview.config.ts mobile-checkout-details checkout-thumbnail-real-route --project=chromium-1440x900 --project=chromium-pixel8-portrait --project=webkit-iphone15pro-portrait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-payment-artwork-regressions
          path: test-results/
          retention-days: 7
