name: Apply Direct Artwork Upload Recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-direct-artwork-upload-recovery.mjs'
      - 'src/utils/uploadArtworkFile.ts'
      - 'src/utils/uploadArtworkFile.test.ts'
      - 'src/utils/uploadCanvasImage.ts'
      - 'netlify/functions/cloudinary-upload-signature.mjs'
      - 'netlify/functions/_shared/legacy/cloudinary-upload-signature.cjs'
      - 'netlify/functions/__tests__/cloudinary-upload-signature.test.cjs'
      - 'netlify/functions/__tests__/direct-artwork-upload-flow.test.cjs'
      - '.github/workflows/apply-direct-artwork-upload-recovery.yml'

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply the upload and Buy Now source repair
        run: node scripts/apply-direct-artwork-upload-recovery.mjs

      - name: Run focused upload and thumbnail tests
        run: |
          node --test \
            netlify/functions/__tests__/cloudinary-upload-signature.test.cjs \
            netlify/functions/__tests__/direct-artwork-upload-flow.test.cjs \
            netlify/functions/__tests__/preview-pipeline.test.cjs \
            netlify/functions/__tests__/sitewide-preview-surfaces.test.cjs \
            netlify/functions/__tests__/email-preview-source.test.cjs \
            netlify/functions/__tests__/checkout-paypal-only.test.cjs

          npx vitest run \
            src/utils/uploadArtworkFile.test.ts \
            src/lib/previewSelection.test.ts \
            src/lib/__tests__/previewSelection.test.ts \
            src/lib/sitewidePreviewSurfaces.test.ts \
            --reporter=verbose

      - name: Type-check, function-check, and build production
        run: |
          npx tsc --noEmit --pretty false
          find netlify/functions -maxdepth 1 -name '*.mjs' -print0 | xargs -0 -n1 node --check
          npm run build
          git diff --check

      - name: Remove the one-time source patch script
        run: rm -f scripts/apply-direct-artwork-upload-recovery.mjs

      - name: Commit the validated application source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P0: make artwork uploads and Buy Now recover automatically'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
