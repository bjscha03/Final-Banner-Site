name: One-time fix admin tracking labels

on:
  push:
    branches:
      - hotfix/admin-email-links-and-tracking-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/admin-email-links-and-tracking-controls
          fetch-depth: 0

      - name: Apply exact source replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/admin/Orders.tsx')
          source = path.read_text(encoding='utf-8')

          old_conditional = "order.shipping_notification_sent ? 'Resend Tracking Email' : 'Resend Tracking Email'"
          new_conditional = "order.shipping_notification_sent ? 'Resend Tracking Email' : 'Send Tracking Email'"
          if source.count(old_conditional) != 1:
              raise SystemExit(f'Expected exactly one desktop tracking-label bug, found {source.count(old_conditional)}')
          source = source.replace(old_conditional, new_conditional, 1)

          mobile_pattern = re.compile(r'(<Mail className="h-3 w-3 mr-1"\s*/>\s*)Resend Tracking Email')
          source, mobile_count = mobile_pattern.subn(
              r"\1{order.shipping_notification_sent ? 'Resend Tracking Email' : 'Send Tracking Email'}",
              source,
              count=1,
          )
          if mobile_count != 1:
              raise SystemExit(f'Expected exactly one mobile tracking-label bug, found {mobile_count}')

          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/one-time-fix-tracking-labels.yml').unlink()
          PY

      - name: Commit exact patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/Orders.tsx .github/workflows/one-time-fix-tracking-labels.yml
          git commit -m 'Fix first-send tracking email labels in admin'
          git push origin HEAD:hotfix/admin-email-links-and-tracking-controls
