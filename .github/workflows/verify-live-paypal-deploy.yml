name: Verify Live PayPal Deploy

on:
  pull_request:
    paths:
      - '.github/workflows/verify-live-paypal-deploy.yml'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for the merged production bundle
        shell: bash
        run: |
          set -euo pipefail

          site='https://bannersonthefly.com'
          marker_one='bof-paypal-checkout-v4:'
          marker_two='Completing payment...'

          for attempt in $(seq 1 48); do
            cache_buster="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            html_file="$(mktemp)"
            bundle_file="$(mktemp)"

            if curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              "${site}/checkout?deploy_check=${cache_buster}" \
              --output "${html_file}"; then

              mapfile -t current_assets < <(
                grep -oE 'src="[^"]+\.js[^"]*"' "${html_file}" \
                  | sed -E 's/^src="//; s/"$//' \
                  | sort -u \
                  || true
              )

              declare -A seen_assets=()
              for depth in 1 2 3; do
                next_assets=()

                for asset_path in "${current_assets[@]:-}"; do
                  [[ -z "${asset_path}" ]] && continue
                  asset_path="${asset_path%%\?*}"

                  if [[ "${asset_path}" == http* ]]; then
                    asset_url="${asset_path}"
                  elif [[ "${asset_path}" == /* ]]; then
                    asset_url="${site}${asset_path}"
                  else
                    asset_url="${site}/assets/${asset_path#./}"
                  fi

                  if [[ -n "${seen_assets[${asset_url}]:-}" ]]; then
                    continue
                  fi
                  seen_assets["${asset_url}"]=1

                  js_file="$(mktemp)"
                  if curl --fail --silent --show-error --location \
                    -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                    "${asset_url}?deploy_check=${cache_buster}" \
                    --output "${js_file}"; then
                    cat "${js_file}" >> "${bundle_file}"

                    while IFS= read -r child_asset; do
                      [[ -n "${child_asset}" ]] && next_assets+=("${child_asset}")
                    done < <(
                      grep -oE '[A-Za-z0-9_.-]+-[A-Za-z0-9_.-]+\.js' "${js_file}" \
                        | sort -u \
                        || true
                    )
                  fi
                  rm -f "${js_file}"
                done

                current_assets=("${next_assets[@]:-}")
                [[ ${#current_assets[@]} -eq 0 ]] && break
              done

              if grep -Fq "${marker_one}" "${bundle_file}" \
                && grep -Fq "${marker_two}" "${bundle_file}"; then
                echo 'Production is serving the new reliable PayPal checkout bundle.'
                rm -f "${html_file}" "${bundle_file}"
                exit 0
              fi
            fi

            rm -f "${html_file}" "${bundle_file}"
            echo "Production has not published the merged bundle yet (attempt ${attempt}/48)."
            sleep 10
          done

          echo 'Production did not publish the merged PayPal bundle within the verification window.' >&2
          exit 1

      - name: Verify live PayPal configuration is enabled
        shell: bash
        run: |
          set -euo pipefail

          config_file="$(mktemp)"
          status="$({ curl --silent --show-error --location \
            --output "${config_file}" \
            --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache, no-store, must-revalidate' \
            "https://bannersonthefly.com/.netlify/functions/paypal-config?deploy_check=${GITHUB_RUN_ID}"; } || true)"

          if [[ "${status}" != '200' ]]; then
            echo "Live PayPal config returned HTTP ${status}." >&2
            exit 1
          fi

          CONFIG_FILE="${config_file}" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.CONFIG_FILE, 'utf8'));
          if (payload.enabled !== true) throw new Error('Live PayPal configuration is not enabled.');
          if (!payload.clientId || typeof payload.clientId !== 'string') throw new Error('Live PayPal client ID is missing.');
          if (payload.environment !== 'live') throw new Error(`Expected live PayPal environment, received ${payload.environment}.`);
          console.log('Live PayPal configuration is enabled in the live environment.');
          NODE

      - name: Verify the new background follow-up function is deployed
        shell: bash
        run: |
          set -euo pipefail

          status="$({ curl --silent --show-error --location \
            --output /dev/null \
            --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-Internal-Job-Secret: intentionally-invalid-production-smoke-value' \
            --data '{"orderId":"production-smoke-no-op"}' \
            'https://bannersonthefly.com/.netlify/functions/process-paid-order-followups-background'; } || true)"

          # Netlify background functions acknowledge invocation with 202 before
          # the handler rejects the deliberately invalid internal secret.
          if [[ "${status}" != '202' ]]; then
            echo "Expected the deployed background function to return HTTP 202, received ${status}." >&2
            exit 1
          fi

          echo 'The paid-order background follow-up function is deployed.'
