name: Verify Sitewide Thumbnail and Expanded Previews Are Live

on:
  pull_request:
    paths:
      - '.github/workflows/verify-sitewide-thumbnails-live.yml'

permissions:
  contents: read

jobs:
  production-sitewide-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for production to serve the complete sitewide preview bundle
        shell: bash
        run: |
          set -euo pipefail

          site='https://bannersonthefly.com'
          success='false'

          for attempt in $(seq 1 36); do
            echo "Production sitewide-preview verification attempt ${attempt}/36"
            html_file="$(mktemp)"
            bundle_file="$(mktemp)"

            status="$({ curl --silent --show-error --location \
              --output "${html_file}" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              "${site}/checkout?sitewide_preview_deploy_check=${GITHUB_RUN_ID}-${attempt}"; } || true)"

            if [[ "${status}" == '200' ]]; then
              mapfile -t initial_assets < <(
                grep -oE 'src="[^"]+\.js[^"]*"' "${html_file}" \
                  | sed -E 's/^src="//; s/"$//' \
                  | sed -E 's/[?].*$//' \
                  | sort -u \
                  || true
              )

              declare -A seen=()
              queue=("${initial_assets[@]:-}")

              for depth in 1 2 3 4 5 6; do
                next_queue=()
                for asset_path in "${queue[@]:-}"; do
                  [[ -z "${asset_path}" ]] && continue

                  if [[ "${asset_path}" == http* ]]; then
                    asset_url="${asset_path}"
                    normalized_path="${asset_path}"
                  else
                    [[ "${asset_path}" != /* ]] && asset_path="/${asset_path}"
                    asset_url="${site}${asset_path}"
                    normalized_path="${asset_path}"
                  fi

                  [[ -n "${seen[${normalized_path}]:-}" ]] && continue
                  seen["${normalized_path}"]=1

                  asset_file="$(mktemp)"
                  separator='?'
                  [[ "${asset_url}" == *'?'* ]] && separator='&'
                  if curl --fail --silent --show-error --location \
                    -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                    "${asset_url}${separator}sitewide_preview_deploy_check=${GITHUB_RUN_ID}-${attempt}-${depth}" \
                    --output "${asset_file}"; then
                    cat "${asset_file}" >> "${bundle_file}"

                    while IFS= read -r ref; do
                      [[ -z "${ref}" ]] && continue
                      case "${ref}" in
                        ./*) candidate="/assets/${ref#./}" ;;
                        /assets/*) candidate="${ref}" ;;
                        assets/*) candidate="/${ref}" ;;
                        *) continue ;;
                      esac
                      [[ -z "${seen[${candidate}]:-}" ]] && next_queue+=("${candidate}")
                    done < <(
                      grep -oE '(\./|/assets/|assets/)[A-Za-z0-9._-]+\.js' "${asset_file}" \
                        | sort -u \
                        || true
                    )
                  fi
                  rm -f "${asset_file}"
                done
                queue=("${next_queue[@]:-}")
                [[ ${#queue[@]} -eq 0 ]] && break
              done

              required_markers=(
                'data-commerce-preview'
                'data-order-item-preview'
                'data-order-item-expanded-preview'
                'data-admin-product-preview'
                'data-preview-loading-overlay'
                'data-preview-exact'
                'data-expanded-product-preview'
                'yard_sign_preview'
                'placement_preview'
                'original_fallback'
                'Loading preview'
                'Preview unavailable'
                'safe-area-inset-top'
                'safe-area-inset-bottom'
                'Open expanded'
              )

              missing='false'
              for marker in "${required_markers[@]}"; do
                if ! grep -Fq "${marker}" "${bundle_file}"; then
                  echo "Production bundle is still missing marker: ${marker}"
                  missing='true'
                fi
              done

              if [[ "${missing}" == 'false' ]]; then
                success='true'
                rm -f "${html_file}" "${bundle_file}"
                break
              fi
            else
              echo "Checkout returned HTTP ${status}."
            fi

            rm -f "${html_file}" "${bundle_file}"
            sleep 20
          done

          if [[ "${success}" != 'true' ]]; then
            echo 'Production never served the complete sitewide thumbnail/lightbox bundle.' >&2
            exit 1
          fi

          echo 'Production is serving the complete sitewide thumbnail and expanded-preview bundle.'

      - name: Verify every customer and Admin preview route serves the deployed application
        shell: bash
        run: |
          set -euo pipefail

          site='https://bannersonthefly.com'
          routes=(
            '/'
            '/design'
            '/checkout'
            '/payment-success'
            '/order-confirmation'
            '/my-orders'
            '/orders/00000000-0000-4000-8000-000000000000'
            '/admin/orders'
            '/google-ads-banner'
          )

          for route in "${routes[@]}"; do
            safe_name=$(printf '%s' "$route" | tr '/:' '__' | sed 's/^_//')
            [[ -z "${safe_name}" ]] && safe_name='home'
            status=$(curl --silent --show-error --location \
              --output "/tmp/${safe_name}.html" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              "${site}${route}?sitewide_preview_route_check=${GITHUB_RUN_ID}")
            if [[ "${status}" != '200' ]]; then
              echo "${route} returned HTTP ${status}." >&2
              exit 1
            fi
            grep -qi '<!doctype html' "/tmp/${safe_name}.html"
          done

          echo 'Design, cart/checkout, confirmation, My Orders, order detail, Admin, and landing-page routes are live.'

      - name: Verify optimized artwork delivery is live
        shell: bash
        run: |
          set -euo pipefail

          derivative='https://res.cloudinary.com/dtrxl120u/image/upload/f_auto,q_auto:good,w_800,c_limit/v1767723458/upscaled-2x-Screenshot_2025-10-07_at_2.29.47_PM_wegqxg_ubaxdz.png'
          headers_file="$(mktemp)"
          image_file="$(mktemp)"

          status=$(curl --silent --show-error --location \
            --dump-header "${headers_file}" \
            --output "${image_file}" \
            --write-out '%{http_code}' \
            "${derivative}?sitewide_preview_cdn_check=${GITHUB_RUN_ID}")

          test "${status}" = '200'
          grep -qi '^content-type: image/' "${headers_file}"
          test -s "${image_file}"

          echo 'Cloudinary is delivering optimized non-empty browser preview derivatives.'

      - name: Verify production order and Admin functions initialize safely
        shell: bash
        run: |
          set -euo pipefail

          public_order_status=$(curl --silent --show-error --location \
            --output /tmp/public-order.json \
            --write-out '%{http_code}' \
            'https://bannersonthefly.com/.netlify/functions/get-order?id=00000000-0000-4000-8000-000000000000')
          test "${public_order_status}" = '404'
          grep -q 'Order not found' /tmp/public-order.json

          admin_status=$(curl --silent --show-error --location \
            --output /tmp/admin-orders.json \
            --write-out '%{http_code}' \
            'https://bannersonthefly.com/.netlify/functions/get-orders?page=1')
          test "${admin_status}" = '401'
          grep -q 'UNAUTHORIZED' /tmp/admin-orders.json

          echo 'Customer order and Admin order endpoints are deployed and initializing safely.'
