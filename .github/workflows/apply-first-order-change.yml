name: Apply reviewed first-order change
on:
  push:
    branches: ['feat/automatic-first-order-discount']
    paths: ['.github/workflows/apply-first-order-change.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-first-order-discount
      - name: Verify and apply the reviewed source patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          parts = ''.join(pathlib.Path(f'scripts/first-order-patch-{i}.txt').read_text().strip() for i in range(3))
          patch = gzip.decompress(base64.b64decode(parts, validate=True))
          expected = '685cf95a07866ddd4b3c7f8ff8cfdd6f79ecca323062626fac201df4de6372dc'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch integrity mismatch'
          pathlib.Path('/tmp/first-order.patch').write_bytes(patch)
          PY
          git apply --exclude='.github/workflows/*' --check /tmp/first-order.patch
          git apply --exclude='.github/workflows/*' /tmp/first-order.patch
          git diff --check
          git add src netlify/functions tests playwright.first-order.config.ts
          git rm scripts/first-order-patch-0.txt scripts/first-order-patch-1.txt scripts/first-order-patch-2.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Automatically apply eligible first-order pricing across builder and checkout'
          git push origin HEAD:feat/automatic-first-order-discount
