name: Banner Unit Deploy Validation

on:
  pull_request:
    paths:
      - '.github/workflows/banner-unit-deploy-validation.yml'
      - 'src/main.tsx'
      - 'src/components/design/SizeQuantityCard.tsx'

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify banner unit default contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const BANNER_UNIT_PREFERENCE_KEY = 'banner-unit-pref';" src/main.tsx
          grep -F "localStorage.setItem(BANNER_UNIT_PREFERENCE_KEY, 'ft');" src/main.tsx
          grep -F "restoreBannerUnitDefault();" src/main.tsx
          grep -F "useState<DimensionUnit>('ft')" src/components/design/SizeQuantityCard.tsx
          grep -F "?? 'ft'" src/pages/Design.tsx
          grep -F "?? 'ft'" src/pages/GoogleAdsBanner.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy production with existing GitHub Netlify credential
        id: netlify_deploy
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_AUTH_TOKEN_ALT: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_AUTH_TOKEN_ACCESS: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
          NETLIFY_AUTH_TOKEN_PAT: ${{ secrets.NETLIFY_PAT }}
        run: |
          set -euo pipefail
          token="${NETLIFY_AUTH_TOKEN_PRIMARY:-}"
          if [ -z "$token" ]; then token="${NETLIFY_AUTH_TOKEN_ALT:-}"; fi
          if [ -z "$token" ]; then token="${NETLIFY_AUTH_TOKEN_ACCESS:-}"; fi
          if [ -z "$token" ]; then token="${NETLIFY_AUTH_TOKEN_PAT:-}"; fi
          if [ -z "$token" ]; then
            echo "NETLIFY_DEPLOY_SECRET_MISSING"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx netlify deploy \
            --prod \
            --dir=dist \
            --site=b746092a-ac37-467b-8f5e-fdc46b296ef2 \
            --auth="$token" \
            --message="Banner default Feet regression fix"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Package Netlify MCP runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/netlify-mcp-runtime
          mkdir -p /tmp/netlify-mcp-runtime
          npm install --prefix /tmp/netlify-mcp-runtime --no-package-lock --no-save @netlify/mcp@latest
          tar -C /tmp/netlify-mcp-runtime -czf netlify-mcp-runtime.tgz .

      - name: Upload Netlify MCP runtime
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-runtime-${{ github.event.pull_request.head.sha }}
          path: netlify-mcp-runtime.tgz
          retention-days: 1

      - name: Upload deployable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: banners-on-the-fly-source-${{ github.event.pull_request.head.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
            !netlify-mcp-runtime.tgz
          include-hidden-files: true
          retention-days: 1
