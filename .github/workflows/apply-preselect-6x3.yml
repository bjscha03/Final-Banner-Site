name: Apply preselected 6x3 pricing patch

on:
  push:
    branches:
      - fix/preselect-6x3-pricing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/preselect-6x3-pricing
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused default-size and pricing patch
        run: |
          python <<'PY'
          from pathlib import Path

          pages = [
              Path('src/pages/Design.tsx'),
              Path('src/pages/GoogleAdsBanner.tsx'),
          ]

          old_default = """  // Keep 6′ × 3′ visually highlighted as the recommended size, but leave the
            // order unpriced until the customer explicitly chooses or confirms a size.
            const [hasConfirmedSize, setHasConfirmedSize] = useState(false);"""
          new_default = """  // Start banner visitors with the 6′ × 3′ popular preset fully selected so
            // its automatic 25%-off price is visible immediately on first load.
            const [hasConfirmedSize, setHasConfirmedSize] = useState(initialProductType === 'banner');"""

          for path in pages:
              text = path.read_text(encoding='utf-8')
              if text.count(old_default) != 1:
                  raise SystemExit(f'Expected one initial-size block in {path}; found {text.count(old_default)}')
              text = text.replace(old_default, new_default)

              old_mobile_condition = ') : promoApplied ? ('
              if text.count(old_mobile_condition) != 1:
                  raise SystemExit(f'Expected one mobile discount condition in {path}; found {text.count(old_mobile_condition)}')
              text = text.replace(old_mobile_condition, ') : bannerPromoActuallyApplied ? (')

              old_mobile_price = '<p className="text-xl font-bold text-green-600">{usd(discountedTotal)}</p>'
              new_mobile_price = '<p className="text-xl font-bold text-[#0B1F3A]">{usd(discountedTotal)}</p>'
              if text.count(old_mobile_price) != 1:
                  raise SystemExit(f'Expected one mobile discounted-price line in {path}; found {text.count(old_mobile_price)}')
              text = text.replace(old_mobile_price, new_mobile_price)
              path.write_text(text, encoding='utf-8')

          initial_test = Path('src/lib/bannerInitialPricingState.test.ts')
          text = initial_test.read_text(encoding='utf-8')
          old_test_name = "it.each(pages)('$route keeps 6 × 3 highlighted without pricing it on first load', ({ source }) => {"
          new_test_name = "it.each(pages)('$route preselects and prices the 6 × 3 banner on first load', ({ source }) => {"
          if text.count(old_test_name) != 1:
              raise SystemExit('Initial-pricing test name did not match expected source')
          text = text.replace(old_test_name, new_test_name)

          old_assertions = """    expect(source).toContain(
                'const [hasConfirmedSize, setHasConfirmedSize] = useState(false);',
              );
              expect(source).not.toContain(
                \"const [hasConfirmedSize, setHasConfirmedSize] = useState(initialProductType === 'banner');\",
              );"""
          new_assertions = """    expect(source).toContain(
                \"const [hasConfirmedSize, setHasConfirmedSize] = useState(initialProductType === 'banner');\",
              );
              expect(source).not.toContain(
                'const [hasConfirmedSize, setHasConfirmedSize] = useState(false);',
              );"""
          if text.count(old_assertions) != 1:
              raise SystemExit('Initial-pricing source assertions did not match expected source')
          text = text.replace(old_assertions, new_assertions)
          anchor = "    expect(source).toContain('setHasConfirmedSize(true);');\n"
          if text.count(anchor) != 1:
              raise SystemExit('Initial-pricing test anchor did not match expected source')
          text = text.replace(
              anchor,
              anchor + "    expect(source).toContain(') : bannerPromoActuallyApplied ? (');\n",
          )
          text = text.replace(
              "it('labels the visible preset as a recommendation rather than a selection', () => {",
              "it('labels the selected default as the most popular size', () => {",
          )
          initial_test.write_text(text, encoding='utf-8')

          defaults_test = Path('src/lib/bannerDefaults.test.ts')
          text = defaults_test.read_text(encoding='utf-8')
          import_anchor = "import { calculateBannerPricing } from './bannerPricingEngine';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('Banner-default test import anchor did not match expected source')
          text = text.replace(import_anchor, import_anchor + "import { resolvePromo } from './promoEngine';\n")

          old_case = """  it('defines the 6 by 3 preset as the highlighted recommendation', () => {
              expect(POPULAR_BANNER_PRESET).toMatchObject({ widthIn: 72, heightIn: 36, presetIndex: 2 });
              expect(isPopularBannerPreset('banner', 72, 36, 2)).toBe(true);
              expect(calculateBannerPricing({
                widthIn: POPULAR_BANNER_PRESET.widthIn,
                heightIn: POPULAR_BANNER_PRESET.heightIn,
                quantity: 1,
                material: '13oz',
              }).subtotalBeforeDiscountCents).toBe(8100);
            });"""
          new_case = """  it('defines 6 by 3 as the selected default and resolves its automatic 25% price', () => {
              expect(POPULAR_BANNER_PRESET).toMatchObject({ widthIn: 72, heightIn: 36, presetIndex: 2 });
              expect(isPopularBannerPreset('banner', 72, 36, 2)).toBe(true);

              const pricing = calculateBannerPricing({
                widthIn: POPULAR_BANNER_PRESET.widthIn,
                heightIn: POPULAR_BANNER_PRESET.heightIn,
                quantity: 1,
                material: '13oz',
              });
              expect(pricing.subtotalBeforeDiscountCents).toBe(8100);

              const discount = resolvePromo({
                subtotalCents: pricing.subtotalBeforeDiscountCents,
                quantity: 1,
                items: [{
                  id: 'default-6x3-banner',
                  product_type: 'banner',
                  width_in: POPULAR_BANNER_PRESET.widthIn,
                  height_in: POPULAR_BANNER_PRESET.heightIn,
                  line_total_cents: pricing.subtotalBeforeDiscountCents,
                }],
              });
              expect(discount).toMatchObject({
                promotionId: 'LARGE_BANNER_25',
                appliedDiscountType: 'promo',
                appliedDiscountAmountCents: 2025,
              });
              expect(pricing.subtotalBeforeDiscountCents - discount.appliedDiscountAmountCents).toBe(6075);
            });"""
          if text.count(old_case) != 1:
              raise SystemExit('Banner-default pricing test did not match expected source')
          text = text.replace(old_case, new_case)
          defaults_test.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/apply-preselect-6x3.yml')
          workflow.unlink()
          PY

      - name: Install exact dependencies
        run: npm ci

      - name: Run focused pricing regressions
        run: npx vitest run src/lib/bannerInitialPricingState.test.ts src/lib/bannerDefaults.test.ts src/lib/bannerCheckoutReadiness.test.ts

      - name: Type-check application
        run: npx tsc --noEmit --pretty false

      - name: Build production bundle
        run: npm run build

      - name: Commit the verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preselect 6x3 banner and show discounted pricing"
          git push origin HEAD:fix/preselect-6x3-pricing
