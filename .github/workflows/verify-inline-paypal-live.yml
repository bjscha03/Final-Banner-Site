name: Verify Authoritative Inline PayPal Checkout Is Live

on:
  pull_request:
    paths:
      - '.github/workflows/verify-inline-paypal-live.yml'

permissions:
  contents: read

jobs:
  production-inline-paypal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production checkout bundle and verify required inline fields
        shell: bash
        run: |
          set -euo pipefail

          site='https://bannersonthefly.com'
          success='false'

          for attempt in $(seq 1 24); do
            echo "Production bundle verification attempt ${attempt}/24"
            html_file="$(mktemp)"
            bundle_file="$(mktemp)"

            checkout_status="$({ curl --silent --show-error --location \
              --output "${html_file}" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              "${site}/checkout?deploy_check=${GITHUB_RUN_ID}-${attempt}"; } || true)"

            if [[ "${checkout_status}" == '200' ]]; then
              mapfile -t initial_assets < <(
                grep -oE 'src="[^"]+\.js[^"]*"' "${html_file}" \
                  | sed -E 's/^src="//; s/"$//' \
                  | sed -E 's/[?].*$//' \
                  | sort -u \
                  || true
              )

              declare -A seen=()
              queue=("${initial_assets[@]:-}")

              for depth in 1 2 3 4; do
                next_queue=()
                for asset_path in "${queue[@]:-}"; do
                  [[ -z "${asset_path}" ]] && continue

                  if [[ "${asset_path}" == http* ]]; then
                    asset_url="${asset_path}"
                    normalized_path="${asset_path}"
                  else
                    [[ "${asset_path}" != /* ]] && asset_path="/${asset_path}"
                    asset_url="${site}${asset_path}"
                    normalized_path="${asset_path}"
                  fi

                  [[ -n "${seen[${normalized_path}]:-}" ]] && continue
                  seen["${normalized_path}"]=1

                  asset_file="$(mktemp)"
                  separator='?'
                  [[ "${asset_url}" == *'?'* ]] && separator='&'
                  if curl --fail --silent --show-error --location \
                    -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                    "${asset_url}${separator}deploy_check=${GITHUB_RUN_ID}-${attempt}-${depth}" \
                    --output "${asset_file}"; then
                    cat "${asset_file}" >> "${bundle_file}"

                    while IFS= read -r ref; do
                      [[ -z "${ref}" ]] && continue
                      case "${ref}" in
                        ./*) candidate="/assets/${ref#./}" ;;
                        /assets/*) candidate="${ref}" ;;
                        assets/*) candidate="/${ref}" ;;
                        *) continue ;;
                      esac
                      [[ -z "${seen[${candidate}]:-}" ]] && next_queue+=("${candidate}")
                    done < <(
                      grep -oE '(\./|/assets/|assets/)[A-Za-z0-9._-]+\.js' "${asset_file}" \
                        | sort -u \
                        || true
                    )
                  fi
                  rm -f "${asset_file}"
                done
                queue=("${next_queue[@]:-}")
                [[ ${#queue[@]} -eq 0 ]] && break
              done

              required_markers=(
                'bof-paypal-checkout-v5:'
                'Pay with Debit or Credit Card'
                'First Name *'
                'Last Name *'
                'Email *'
                'Phone *'
                'Country *'
                'Street Address *'
                'Apartment / Suite'
                'City *'
                'State *'
                'ZIP *'
                'Shipping same as billing'
                'Shipping Address *'
                'Pay Now'
                'Pay securely by card or PayPal. No PayPal account required.'
                'PayPal did not complete a capture within 30 seconds.'
              )

              missing='false'
              for marker in "${required_markers[@]}"; do
                if ! grep -Fq "${marker}" "${bundle_file}"; then
                  echo "Missing production marker: ${marker}"
                  missing='true'
                fi
              done

              if [[ "${missing}" == 'false' ]]; then
                success='true'
                rm -f "${html_file}" "${bundle_file}"
                break
              fi
            else
              echo "Checkout returned HTTP ${checkout_status}."
            fi

            rm -f "${html_file}" "${bundle_file}"
            sleep 20
          done

          if [[ "${success}" != 'true' ]]; then
            echo 'Production never served the authoritative inline checkout bundle.' >&2
            exit 1
          fi

          echo 'Production is serving the full inline customer, billing, shipping, and card checkout bundle.'

      - name: Verify live PayPal configuration enables Card Fields securely
        shell: bash
        run: |
          set -euo pipefail

          success='false'
          for attempt in $(seq 1 24); do
            echo "Live PayPal configuration attempt ${attempt}/24"
            config_file="$(mktemp)"
            status="$({ curl --silent --show-error --location \
              --output "${config_file}" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              "https://bannersonthefly.com/.netlify/functions/paypal-config?deploy_check=${GITHUB_RUN_ID}-${attempt}"; } || true)"

            if [[ "${status}" == '200' ]]; then
              if CONFIG_FILE="${config_file}" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.CONFIG_FILE, 'utf8'));
          if (payload.enabled !== true) throw new Error('Live PayPal configuration is not enabled.');
          if (!payload.clientId || typeof payload.clientId !== 'string') throw new Error('Live client ID is missing.');
          if (payload.environment !== 'live') throw new Error(`Expected live environment, received ${payload.environment}.`);
          if (payload.components !== 'buttons,card-fields') throw new Error(`Expected buttons,card-fields; received ${payload.components}.`);
          if (!payload.clientToken || typeof payload.clientToken !== 'string' || payload.clientToken.length < 20) {
            throw new Error('Short-lived Card Fields client token is missing.');
          }
          for (const forbidden of ['clientSecret', 'secret', 'PAYPAL_SECRET', 'PAYPAL_CLIENT_SECRET']) {
            if (Object.prototype.hasOwnProperty.call(payload, forbidden)) {
              throw new Error(`Sensitive property exposed: ${forbidden}`);
            }
          }
          if (Object.prototype.hasOwnProperty.call(payload, 'fastlane')) {
            throw new Error('Obsolete acceleration configuration is still exposed.');
          }
          console.log('Live PayPal configuration is enabled, live, and Card Fields-ready without exposing a merchant secret.');
          NODE
              then
                success='true'
                rm -f "${config_file}"
                break
              fi
            else
              echo "PayPal config returned HTTP ${status}."
            fi

            rm -f "${config_file}"
            sleep 20
          done

          if [[ "${success}" != 'true' ]]; then
            echo 'Live PayPal Card Fields configuration did not become ready.' >&2
            exit 1
          fi

      - name: Verify confirmation and post-payment functions are deployed
        shell: bash
        run: |
          set -euo pipefail

          confirmation_status="$({ curl --silent --show-error --location \
            --output /dev/null \
            --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache, no-store, must-revalidate' \
            "https://bannersonthefly.com/payment-success?deploy_check=${GITHUB_RUN_ID}"; } || true)"

          if [[ "${confirmation_status}" != '200' ]]; then
            echo "Order confirmation route returned HTTP ${confirmation_status}." >&2
            exit 1
          fi

          background_status="$({ curl --silent --show-error --location \
            --output /dev/null \
            --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-Internal-Job-Secret: intentionally-invalid-production-smoke-value' \
            --data '{"orderId":"production-smoke-no-op"}' \
            'https://bannersonthefly.com/.netlify/functions/process-paid-order-followups-background'; } || true)"

          if [[ "${background_status}" != '202' ]]; then
            echo "Expected paid-order background function HTTP 202, received ${background_status}." >&2
            exit 1
          fi

          payment_status="$({ curl --silent --show-error --location \
            --output /dev/null \
            --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{}' \
            'https://bannersonthefly.com/.netlify/functions/paypal-payment-status'; } || true)"

          if [[ "${payment_status}" != '400' ]]; then
            echo "Expected payment-status function HTTP 400 for a missing order, received ${payment_status}." >&2
            exit 1
          fi

          echo 'The confirmation route, paid-order follow-up worker, and authoritative payment-status function are live.'
