name: BOF referral program
on:
  pull_request:
    paths:
      - 'src/**'
      - 'netlify/functions/**'
      - 'migrations/045_bof_referral_program.sql'
      - 'tests/browser/bof-referrals.playwright.spec.ts'
      - 'playwright.bof-referrals.config.ts'
      - '.github/workflows/bof-referral-program.yml'
permissions:
  contents: read
jobs:
  bof-referrals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore declared optional native metadata in the QA checkout
        # Existing lock metadata marks foreign-platform Rollup/fsevents
        # packages as required. Only restore packages that their parents
        # explicitly declare optional. Versions/integrity hashes stay fixed;
        # this disposable checkout does not change the production lockfile.
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = Object.entries(lock.packages || {});
          const optionalNames = new Set(packages.flatMap(([, pkg]) => Object.keys(pkg.optionalDependencies || {})));
          let repaired = 0;
          for (const [path, pkg] of packages) {
            const name = path.slice(path.lastIndexOf('node_modules/') + 'node_modules/'.length);
            if ((pkg.os || pkg.cpu) && optionalNames.has(name) && pkg.optional !== true) {
              pkg.optional = true;
              repaired++;
            }
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          console.log(`Restored optional metadata on ${repaired} declared optional native packages.`);
          NODE
      - run: npm ci
      - name: Ledger, guest access, margin, and tracking tests
        run: npx vitest run --config vitest.ai.config.ts netlify/functions/__tests__/bof-program.test.mjs netlify/functions/__tests__/bof-api.test.mjs src/lib/__tests__/admin-profit-estimate.test.ts src/lib/trackingPolicy.test.ts
      - name: Production build
        run: npm run build
      - name: Bundle payment and referral functions for the production Node version
        run: npx esbuild netlify/functions/bof-cash.mjs netlify/functions/bof-maintenance.mjs netlify/functions/bof-maintenance-background.mjs netlify/functions/get-orders.mjs netlify/functions/admin-customers.mjs netlify/functions/stripe-webhook.mjs netlify/functions/stripe-create-payment-intent.mjs netlify/functions/paypal-capture-order.mjs --bundle --platform=node --target=node20 --format=esm --packages=external --outdir=/tmp/bof-function-bundles
      - name: Existing customer and order reports
        run: |
          node netlify/functions/__tests__/admin-customers-handler.test.mjs
          node netlify/functions/__tests__/get-orders-reporting.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Desktop and phone customer/admin flows
        run: npx playwright test --config=playwright.bof-referrals.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bof-referral-results
          path: test-results/
          retention-days: 7
