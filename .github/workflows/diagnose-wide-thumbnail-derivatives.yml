name: Diagnose Exact Wide Banner Derivatives

on:
  pull_request:
    paths:
      - 'scripts/diagnose-wide-thumbnail-derivatives.mjs'
      - '.github/workflows/diagnose-wide-thumbnail-derivatives.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Analyze original and exact commerce derivatives
        run: node scripts/diagnose-wide-thumbnail-derivatives.mjs
