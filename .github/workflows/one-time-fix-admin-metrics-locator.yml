name: Patch Admin metrics locator

on:
  push:
    branches:
      - feat/automatic-large-banner-25

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-large-banner-25
          fetch-depth: 0
      - name: Patch and push
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch.py
          python /tmp/patch.py
          git config user.name "Banners On The Fly CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/browser/admin-commerce-analytics.playwright.spec.ts
          if git diff --staged --quiet; then
            echo "No locator change needed."
          else
            git commit -m "Stabilize Admin metrics browser contract [admin-metrics-locator]"
            git push origin HEAD:feat/automatic-large-banner-25
          fi
