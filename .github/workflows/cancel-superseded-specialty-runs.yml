name: Clear superseded specialty PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write

jobs:
  clear-superseded-runs:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/specialty-products-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only older checks for this specialty pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
        shell: python
        run: |
          import json, os, urllib.error, urllib.parse, urllib.request

          api = os.environ['GITHUB_API_URL']
          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['RELEASE_HEAD_SHA']
          branch = os.environ['RELEASE_BRANCH']
          pr_number = int(os.environ['RELEASE_PR'])
          current_run = int(os.environ['GITHUB_RUN_ID'])
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(path, method='GET'):
              req = urllib.request.Request(api + path, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else {}

          cancelled = 0
          for status in ('queued', 'in_progress'):
              page = 1
              while True:
                  query = urllib.parse.urlencode({
                      'branch': branch, 'event': 'pull_request',
                      'status': status, 'per_page': 100, 'page': page,
                  })
                  runs = request(f'/repos/{repo}/actions/runs?{query}')['workflow_runs']
                  for run in runs:
                      if run['id'] == current_run or run['head_sha'] == head:
                          continue
                      if run['head_branch'] != branch or run['head_repository']['full_name'] != repo:
                          continue
                      if not any(pr['number'] == pr_number for pr in run.get('pull_requests', [])):
                          continue
                      try:
                          request(f"/repos/{repo}/actions/runs/{run['id']}/cancel", 'POST')
                          cancelled += 1
                          print(f"Cancelled superseded run {run['id']}: {run['name']}")
                      except urllib.error.HTTPError as error:
                          if error.code != 409:
                              raise
                  if len(runs) < 100:
                      break
                  page += 1
          print(f'Cancelled {cancelled} superseded runs; current-head checks were preserved.')
