name: Validate BOF preview branch

on:
  push:
    branches:
      - agent/bof-zero-price-tax-preview-20260818
    paths:
      - .github/workflows/bof-preview-cleanup.yml

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: agent/bof-zero-price-tax-preview-20260818
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused pricing tests
        run: npx vitest run src/lib/__tests__/bannerPricingEngine.test.ts

      - name: Run production build
        run: npm run build

      - name: Restore generated social images from main
        run: |
          git fetch origin main
          git checkout origin/main -- \
            public/images/og-car-magnets.png \
            public/images/og-default.png \
            public/images/og-vinyl-banners.png \
            public/images/og-yard-signs.png

      - name: Remove one-time validation workflow
        run: rm .github/workflows/bof-preview-cleanup.yml

      - name: Commit cleanup after successful validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/images/og-car-magnets.png \
            public/images/og-default.png \
            public/images/og-vinyl-banners.png \
            public/images/og-yard-signs.png \
            .github/workflows/bof-preview-cleanup.yml
          git diff --cached --quiet || git commit -m "chore: remove generated preview image changes"
          git push origin HEAD:agent/bof-zero-price-tax-preview-20260818
