name: Compact banner builder browsers
on:
  pull_request:
    paths:
      - 'src/pages/GoogleAdsBanner.tsx'
      - 'src/components/design/**'
      - 'src/components/pricing/**'
      - 'tests/browser/compact-banner-builder.playwright.spec.ts'
      - '.github/workflows/compact-banner-builder.yml'
permissions:
  contents: read
jobs:
  builder-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify desktop, phone and tablet ordering
        run: >-
          npx playwright test --config=playwright.preview.config.ts
          compact-banner-builder.playwright.spec.ts
          --project=chromium-1440x900
          --project=firefox-1280x800
          --project=webkit-1280x800
          --project=webkit-iphone15pro-portrait
          --project=webkit-iphone15pro-landscape
          --project=webkit-iphonese-portrait
          --project=chromium-pixel8-portrait
          --project=webkit-ipad11-portrait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-builder-browser-results
          path: test-results/
          retention-days: 7
