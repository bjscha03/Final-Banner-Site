name: Order, Email, Tracking, and Preview Regressions

on:
  pull_request:
    paths:
      - 'src/components/checkout/**'
      - 'src/components/orders/**'
      - 'src/components/preview/**'
      - 'src/components/design/**'
      - 'src/components/cart/**'
      - 'src/components/home/**'
      - 'src/components/product/**'
      - 'src/components/CartModal.tsx'
      - 'src/components/HeroSection.tsx'
      - 'src/main.tsx'
      - 'src/lib/previewImageCache.ts'
      - 'src/lib/previewArtifactCoordinator.ts'
      - 'src/lib/cartSync.ts'
      - 'src/lib/previewSelection.ts'
      - 'src/lib/previewSourceRegistry.ts'
      - 'src/lib/sessionArtworkPreviewSource.ts'
      - 'src/lib/sessionArtworkPreviewSource.test.ts'
      - 'src/lib/order-thumbnail.ts'
      - 'src/lib/order-thumbnail.test.ts'
      - 'src/lib/commercePreviewUrl.ts'
      - 'src/pages/Checkout.tsx'
      - 'src/pages/Design.tsx'
      - 'src/pages/GoogleAdsBanner.tsx'
      - 'src/pages/CityProductPage.tsx'
      - 'src/pages/ProductHubPage.tsx'
      - 'src/pages/PoliticalSigns.tsx'
      - 'src/store/cart.ts'
      - 'src/utils/generatePositionedThumbnail.ts'
      - 'src/pages/OrderDetail.tsx'
      - 'tests/browser/**'
      - 'playwright.preview.config.ts'
      - 'vite.config.ts'
      - 'netlify/functions/get-order.mjs'
      - 'netlify/functions/get-orders.mjs'
      - 'netlify/functions/update-tracking.mjs'
      - 'netlify/functions/send-shipping-notification.mjs'
      - 'netlify/functions/resend-tracking-email.mjs'
      - 'netlify/functions/_shared/**'
      - 'netlify/functions/__tests__/**'
      - '.github/workflows/order-email-tracking-regressions.yml'

permissions:
  contents: read

jobs:
  regression-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run checkout, preview, order, email, and tracking tests
        run: |
          node --test \
            netlify/functions/__tests__/checkout-paypal-only.test.cjs \
            netlify/functions/__tests__/cart-persistence-ordering.test.cjs \
            netlify/functions/__tests__/preview-pipeline.test.cjs \
            netlify/functions/__tests__/admin-order-visibility.test.cjs \
            netlify/functions/__tests__/mark-in-production-email.test.cjs \
            netlify/functions/__tests__/tracking-email-handler.test.cjs \
            netlify/functions/__tests__/get-order-public.test.cjs

      - name: Run preview source-selection unit tests
        run: |
          npx vitest run \
            src/lib/commercePreviewUrl.test.ts \
            src/lib/previewSelection.test.ts \
            src/lib/__tests__/previewSelection.test.ts \
            src/lib/__tests__/previewArtifactCoordinator.test.ts \
            src/lib/__tests__/cartSync.saveQueue.test.ts \
            src/lib/sessionArtworkPreviewSource.test.ts \
            src/lib/order-thumbnail.test.ts \
            src/store/cart.previewLifecycle.test.ts \
            src/components/checkout/PayPalCheckoutReliable.identity.test.ts \
            --reporter=verbose

      - name: Run real-browser artwork handoff regression
        run: |
          set -euo pipefail
          browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$browser" ]; then
            echo "No supported headless Chrome/Chromium executable was found"
            exit 1
          fi

          npx vite --config tests/browser/vite.handoff.config.ts > /tmp/vite-preview-handoff.log 2>&1 &
          vite_pid=$!

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --disable-background-timer-throttling \
            --disable-component-update \
            --disable-default-apps \
            --disable-sync \
            --metrics-recording-only \
            --no-first-run \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir=/tmp/chrome-preview-handoff \
            about:blank \
            > /tmp/preview-handoff-browser.log 2>&1 &
          chrome_pid=$!

          cleanup() {
            kill "$chrome_pid" 2>/dev/null || true
            kill "$vite_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          vite_ready=0
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /tmp/preview-handoff-shell.html -w '%{http_code}' \
              http://127.0.0.1:4175/tests/browser/preview-handoff.html || true)
            if [ "$code" = "200" ]; then
              vite_ready=1
              break
            fi
            sleep 1
          done
          if [ "$vite_ready" != "1" ]; then
            cat /tmp/vite-preview-handoff.log
            exit 1
          fi

          chrome_ready=0
          for attempt in $(seq 1 100); do
            code=$(curl -sS -o /tmp/chrome-version.json -w '%{http_code}' \
              http://127.0.0.1:9222/json/version || true)
            if [ "$code" = "200" ]; then
              chrome_ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$chrome_ready" != "1" ]; then
            cat /tmp/preview-handoff-browser.log
            exit 1
          fi

          if ! timeout 180s node tests/browser/run-preview-handoff-cdp.mjs; then
            echo "Real-browser preview handoff regression failed"
            cat /tmp/preview-handoff-browser.log || true
            cat /tmp/vite-preview-handoff.log || true
            exit 1
          fi

      - name: Type-check application
        run: npx tsc --noEmit --pretty false

      - name: Build production bundle
        run: npm run build

  deploy-preview-smoke:
    needs: regression-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for matching Netlify Deploy Preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bannersonthefly.netlify.app
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            response=$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status")
            deploy_state=$(jq -r '[.statuses[] | select(.context == "netlify/bannersonthefly/deploy-preview")][0].state // "missing"' <<<"$response")
            if [ "$deploy_state" = "failure" ] || [ "$deploy_state" = "error" ]; then
              echo "Matching Netlify Deploy Preview failed"
              exit 1
            fi
            code=$(curl -sS -L -o /tmp/preview-home.html -w '%{http_code}' "$PREVIEW_URL/" || true)
            if [ "$deploy_state" = "success" ] && [ "$code" = "200" ]; then
              ready=1
              break
            fi
            echo "Matching Deploy Preview not ready (status $deploy_state, HTTP ${code:-none}); attempt $attempt/90"
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "Netlify Deploy Preview did not become ready in time"
            exit 1
          fi
          grep -qi '<!doctype html' /tmp/preview-home.html

      - name: Verify preview-related routes serve the application shell
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bannersonthefly.netlify.app
        run: |
          set -euo pipefail
          for route in /design /google-ads-banner /checkout; do
            safe_name=$(printf '%s' "$route" | tr '/' '_' | sed 's/^_//')
            code=$(curl -sS -L -o "/tmp/${safe_name}.html" -w '%{http_code}' "$PREVIEW_URL$route")
            test "$code" = "200"
            grep -qi '<!doctype html' "/tmp/${safe_name}.html"
          done

      - name: Verify retired campaign routes and functions stay unavailable
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bannersonthefly.netlify.app
        run: |
          set -euo pipefail
          for route in /graduation-signs /graduation-signs/thank-you /proof/fake-token; do
            headers=$(mktemp)
            code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' "$PREVIEW_URL$route")
            test "$code" = "301"
            tr -d '\r' < "$headers" | grep -qi '^location: /custom-banners$'
          done

          for endpoint in \
            designer-intake-submit \
            graduation-proof-approve \
            graduation-proof-get \
            graduation-proof-request-edits \
            paypal-capture-design-deposit \
            paypal-capture-final-product \
            paypal-create-deposit-for-intake; do
            get_code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "$PREVIEW_URL/.netlify/functions/$endpoint")
            post_code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' --data '{}' \
              "$PREVIEW_URL/.netlify/functions/$endpoint")
            test "$get_code" = "410"
            test "$post_code" = "410"
          done

      - name: Verify deployed customer order fallback reaches Neon safely
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bannersonthefly.netlify.app
        run: |
          set -euo pipefail
          # A valid-format UUID that cannot match a real generated order. A 404
          # proves the unauthenticated email-link fallback initialized, imported
          # Neon, queried the database, and returned its limited public contract.
          code=$(curl -sS -o /tmp/public-order.json -w '%{http_code}' \
            "$PREVIEW_URL/.netlify/functions/get-order?id=00000000-0000-4000-8000-000000000000")
          test "$code" = "404"
          grep -q 'Order not found' /tmp/public-order.json

      - name: Verify deployed admin functions initialize before authorization
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--bannersonthefly.netlify.app
        run: |
          set -euo pipefail

          code=$(curl -sS -o /tmp/get-orders.json -w '%{http_code}' \
            "$PREVIEW_URL/.netlify/functions/get-orders?page=1")
          test "$code" = "401"
          grep -q 'UNAUTHORIZED' /tmp/get-orders.json

          for endpoint in update-tracking send-shipping-notification resend-tracking-email; do
            code=$(curl -sS -o "/tmp/${endpoint}.json" -w '%{http_code}' \
              -X POST \
              -H 'Content-Type: application/json' \
              --data '{}' \
              "$PREVIEW_URL/.netlify/functions/${endpoint}")
            test "$code" = "401"
            grep -q 'UNAUTHORIZED' "/tmp/${endpoint}.json"
          done

          for endpoint in ai-designer-status ai-designer-brief ai-designer-generate ai-designer-edit ai-designer-job; do
            code=$(curl -sS -o "/tmp/${endpoint}.json" -w '%{http_code}' \
              -X POST \
              -H 'Content-Type: application/json' \
              --data '{}' \
              "$PREVIEW_URL/.netlify/functions/${endpoint}")
            test "$code" = "401"
            grep -q 'UNAUTHORIZED' "/tmp/${endpoint}.json"
          done

          # A background function acknowledges immediately with 202. This
          # proves the slow GPT Image 2 worker was deployed in background mode
          # rather than under Netlify's fixed 60-second synchronous limit.
          code=$(curl -sS -o /tmp/ai-designer-worker.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$PREVIEW_URL/.netlify/functions/ai-designer-worker-background")
          test "$code" = "202"

  cross-browser-preview-matrix:
    needs: regression-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Playwright engines and branded browsers
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright install chrome msedge

      - name: Run browser, device, network, and lifecycle matrix
        run: npm run test:browser:matrix

      - name: Upload outbound Sales Engine visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outbound-sales-admin-visual-qa
          path: test-results/**/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-browser-matrix-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  responsive-storefront-matrix:
    needs: regression-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build responsive storefront fixture
        run: npm run build

      - name: Run storefront mockup, clipping, and accessibility matrix
        run: npx playwright test --config=playwright.local-pages.config.ts

      - name: Upload storefront failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-storefront-matrix-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
