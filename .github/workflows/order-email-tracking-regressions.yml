name: Order, Email, Tracking, and Preview Regressions

on:
  pull_request:
    paths:
      - 'scripts/apply-checkout-speed-preview-integrity-hotfix.mjs'
      - 'src/lib/paypalCheckoutPreparation.ts'
      - 'src/lib/paypalCheckoutPreparation.test.ts'
      - 'src/lib/previewSelection.ts'
      - 'src/lib/previewSelection.test.ts'
      - '.github/workflows/order-email-tracking-regressions.yml'

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.head_ref == 'hotfix/checkout-speed-preview-integrity'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and commit application changes
        run: |
          set -euo pipefail
          if ! grep -q 'await preloadImage(productionUrl)' src/pages/Design.tsx; then
            echo "Checkout hotfix already applied"
            exit 0
          fi

          # The patcher normally adds its new unit test to the final workflow.
          # Remove the temporary copy first so its deterministic assertion passes.
          sed -i '/src\/lib\/paypalCheckoutPreparation.test.ts/d' .github/workflows/order-email-tracking-regressions.yml
          node scripts/apply-checkout-speed-preview-integrity-hotfix.mjs

          # The app token cannot push workflow-file changes. The connector will
          # install the final regression workflow after this source commit lands.
          git checkout -- .github/workflows/order-email-tracking-regressions.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/Design.tsx \
            src/pages/GoogleAdsBanner.tsx \
            src/store/cart.ts \
            src/pages/Checkout.tsx \
            src/components/checkout/PayPalCheckout.tsx \
            index.html \
            netlify/functions/__tests__/checkout-paypal-only.test.cjs \
            netlify/functions/__tests__/preview-pipeline.test.cjs
          git commit -m "Fix checkout activation, PayPal card latency, and stale previews"
          git push origin HEAD:${{ github.head_ref }}
