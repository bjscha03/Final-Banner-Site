name: AI blog deployment-context verification
on:
  pull_request:
    paths:
      - '.github/workflows/ai-blog-host-check.yml'
      - 'scripts/prerender-ai-blog.mjs'
permissions:
  contents: read
jobs:
  context-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        context: [production, deploy-preview]
    env:
      CONTEXT: ${{ matrix.context }}
      VITE_AI_BANNER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Restore declared optional native metadata in disposable QA checkout
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = Object.entries(lock.packages || {});
          const optionalNames = new Set(packages.flatMap(([, pkg]) => Object.keys(pkg.optionalDependencies || {})));
          for (const [path, pkg] of packages) {
            const name = path.slice(path.lastIndexOf('node_modules/') + 'node_modules/'.length);
            if ((pkg.os || pkg.cpu) && optionalNames.has(name)) pkg.optional = true;
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - run: npm ci
      - name: Verify the article and all existing route gates in this deploy context
        run: npm run build
