name: AI blog hosting verification
on:
  pull_request:
    paths:
      - '.github/workflows/ai-blog-host-check.yml'
      - 'scripts/prerender-ai-blog.mjs'
permissions:
  contents: read
jobs:
  hosting-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_AI_BANNER_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Read publicly available build diagnostics, without credentials
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://api.netlify.com/api/v1/builds/6aad99d121fe830008aae38b/log';
          const response = await fetch(url);
          console.log('Public build-log endpoint status:', response.status);
          if (response.ok) {
            const body = await response.text();
            let lines;
            try {
              const data = JSON.parse(body);
              lines = (Array.isArray(data) ? data : data.lines || []).map(row => typeof row === 'string' ? row : row.message || row.text || '');
            } catch { lines = body.split('\n'); }
            console.log(lines.filter(line => /error|failed|cannot|not found|assertion|ERR_|expected|module/i.test(line)).slice(-30).join('\n'));
          }
          NODE
      - name: Restore declared optional native metadata in disposable QA checkout
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = Object.entries(lock.packages || {});
          const optionalNames = new Set(packages.flatMap(([, pkg]) => Object.keys(pkg.optionalDependencies || {})));
          for (const [path, pkg] of packages) {
            const name = path.slice(path.lastIndexOf('node_modules/') + 'node_modules/'.length);
            if ((pkg.os || pkg.cpu) && optionalNames.has(name)) pkg.optional = true;
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - run: npm ci
      - name: Reproduce complete Netlify preview build without account access
        run: npx netlify build --offline --context deploy-preview
