name: Apply checkout speed and preview integrity hotfix

on:
  push:
    branches:
      - hotfix/checkout-speed-preview-integrity
    paths:
      - scripts/apply-checkout-speed-preview-integrity-hotfix.mjs
      - .github/workflows/apply-checkout-speed-preview-integrity-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/checkout-speed-preview-integrity
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: node scripts/apply-checkout-speed-preview-integrity-hotfix.mjs

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit patched application files
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Hotfix patch produced no changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/Design.tsx \
            src/pages/GoogleAdsBanner.tsx \
            src/store/cart.ts \
            src/pages/Checkout.tsx \
            src/components/checkout/PayPalCheckout.tsx \
            index.html \
            netlify/functions/__tests__/checkout-paypal-only.test.cjs \
            netlify/functions/__tests__/preview-pipeline.test.cjs \
            .github/workflows/order-email-tracking-regressions.yml
          git commit -m "Fix checkout activation, PayPal card latency, and stale previews"
          git push origin HEAD:hotfix/checkout-speed-preview-integrity
