name: Repair abandoned-cart admin payload normalization

on:
  push:
    branches:
      - feat/automatic-large-banner-25

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-large-banner-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Patch payload normalization
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch.py
          python /tmp/patch.py
      - name: Run desktop and mobile Admin browser contracts
        run: |
          browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$browser"
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$browser" npx playwright test --config=playwright.preview.config.ts admin-commerce-analytics.playwright.spec.ts --project=chromium-1440x900 --project=chromium-pixel8-portrait --workers=1
      - name: Lint repair
        run: npx eslint src/pages/admin/AbandonedCarts.tsx tests/browser/admin-commerce-analytics.playwright.spec.ts
      - name: Commit repair and remove workflow
        run: |
          rm .github/workflows/diagnose-admin-commerce-browser.yml
          git config user.name "Banners On The Fly CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/admin/AbandonedCarts.tsx .github/workflows/diagnose-admin-commerce-browser.yml
          git commit -m "Normalize abandoned-cart Admin payload arrays"
          git push origin HEAD:feat/automatic-large-banner-25
