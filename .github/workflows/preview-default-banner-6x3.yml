name: Preview default banner 6x3

on:
  push:
    branches:
      - preview/default-banner-6x3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/default-banner-6x3
          fetch-depth: 0
      - name: Apply focused 6x3 default update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('src/pages/Design.tsx'), Path('src/pages/GoogleAdsBanner.tsx')]

          replacements = [
              ("const [widthFtStr, setWidthFtStr] = useState('4');", "const [widthFtStr, setWidthFtStr] = useState('6');"),
              ("const [heightFtStr, setHeightFtStr] = useState('2');", "const [heightFtStr, setHeightFtStr] = useState('3');"),
              ("const [widthCustomInStr, setWidthCustomInStr] = useState('48');", "const [widthCustomInStr, setWidthCustomInStr] = useState('72');"),
              ("const [heightCustomInStr, setHeightCustomInStr] = useState('24');", "const [heightCustomInStr, setHeightCustomInStr] = useState('36');"),
              ("const [activePreset, setActivePreset] = useState<number | null>(0);", "const [activePreset, setActivePreset] = useState<number | null>(2);"),
          ]

          old_button = '''<button key={i} onClick={() => applyPreset(i)} className={`border rounded-xl py-2.5 px-3 text-sm font-medium transition-all ${activePreset === i ? 'border-orange-500 bg-orange-50 text-orange-700 shadow-sm' : 'border-gray-200 hover:border-gray-400 text-gray-700'}`}>
                              {formatPresetLabel(p.w, p.h, unit)}
                            </button>'''
          new_button = '''<button key={i} onClick={() => applyPreset(i)} className={`relative border rounded-xl py-2.5 px-3 text-sm font-medium transition-all ${activePreset === i ? 'border-orange-500 bg-orange-50 text-orange-700 shadow-sm' : 'border-gray-200 hover:border-gray-400 text-gray-700'}`}>
                              {i === 2 && (
                                <span className="pointer-events-none absolute -top-2.5 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-full bg-orange-500 px-1.5 py-0.5 text-[9px] font-bold uppercase leading-none text-white shadow-sm">
                                  Most Popular
                                </span>
                              )}
                              {formatPresetLabel(p.w, p.h, unit)}
                            </button>'''

          for path in files:
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected 1 occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)

              count = text.count(old_button)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 preset button block, found {count}')
              text = text.replace(old_button, new_button, 1)
              path.write_text(text)
          PY
      - name: Verify only intended files changed
        run: |
          git diff --check
          git diff -- src/pages/Design.tsx src/pages/GoogleAdsBanner.tsx
      - name: Commit focused update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Design.tsx src/pages/GoogleAdsBanner.tsx
          git commit -m "Default banner size to 6x3 with popular badge"
          git push origin HEAD:preview/default-banner-6x3
