name: Remove generated build artifacts from 6x3 patch

on:
  push:
    branches:
      - fix/preselect-6x3-pricing

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/preselect-6x3-pricing
          fetch-depth: 0

      - name: Restore generated social images and remove this workflow
        run: |
          git checkout origin/main -- \
            public/images/og-car-magnets.png \
            public/images/og-default.png \
            public/images/og-vinyl-banners.png \
            public/images/og-yard-signs.png
          rm .github/workflows/cleanup-generated-og.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/og-car-magnets.png public/images/og-default.png public/images/og-vinyl-banners.png public/images/og-yard-signs.png
          git add -u .github/workflows/cleanup-generated-og.yml
          git commit -m "Remove generated build artifacts from 6x3 patch"
          git push origin HEAD:fix/preselect-6x3-pricing
