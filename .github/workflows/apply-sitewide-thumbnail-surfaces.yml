name: Apply Sitewide Thumbnail Surface Hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/patch-customer-order-previews.mjs'
      - 'scripts/patch-admin-email-previews.mjs'
      - 'scripts/patch-yard-sign-preview-identity.mjs'
      - '.github/workflows/apply-sitewide-thumbnail-surfaces.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply focused source patches
        run: |
          node scripts/patch-customer-order-previews.mjs
          node scripts/patch-admin-email-previews.mjs
          node scripts/patch-yard-sign-preview-identity.mjs
          # The repository GitHub App can push source code but cannot update an
          # existing workflow file. The new tests still run explicitly below;
          # restore the permanent workflow before creating the source commit.
          git checkout -- .github/workflows/order-email-tracking-regressions.yml

      - name: Run sitewide preview regression tests
        run: |
          node --test \
            netlify/functions/__tests__/preview-pipeline.test.cjs \
            netlify/functions/__tests__/sitewide-preview-surfaces.test.cjs \
            netlify/functions/__tests__/email-preview-source.test.cjs \
            netlify/functions/__tests__/admin-order-visibility.test.cjs \
            netlify/functions/__tests__/get-order-public.test.cjs

          npx vitest run \
            src/lib/previewSelection.test.ts \
            src/lib/__tests__/previewSelection.test.ts \
            src/lib/order-thumbnail.test.ts \
            src/lib/sitewidePreviewSurfaces.test.ts \
            --reporter=verbose

      - name: Type-check and build production bundle
        run: |
          npx tsc --noEmit --pretty false
          npm run build
          git diff --check

      - name: Remove source patch scripts
        run: |
          rm -f scripts/patch-customer-order-previews.mjs
          rm -f scripts/patch-admin-email-previews.mjs
          rm -f scripts/patch-yard-sign-preview-identity.mjs

      - name: Commit validated source repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize thumbnails across confirmation orders Admin and Resend'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
