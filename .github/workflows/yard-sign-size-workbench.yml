name: Yard sign size workbench
on:
  push:
    branches: [feat/yard-sign-sheet-sizes]
    paths:
      - '.github/workflows/yard-sign-size-workbench.yml'
      - 'tests/browser/yard-sign-sizes.playwright.spec.ts'
      - 'playwright.yard-sign-sizes.config.ts'
permissions:
  contents: write
concurrency:
  group: yard-sign-size-workbench
  cancel-in-progress: false
jobs:
  workbench:
    if: github.ref == 'refs/heads/feat/yard-sign-sheet-sizes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/yard-sign-sheet-sizes
          fetch-depth: 1
      - name: Preserve native Node server imports
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/yard-sign-sheet-sizes'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/admin-profit-estimate.ts')
          p.write_text(p.read_text().replace("from './yard-sign-sizes';", "from './yard-sign-sizes.ts';"))
          p=Path('src/lib/yard-sign-sizes.ts')
          p.write_text(p.read_text().replace("import catalog from '../../shared/yard-sign-sizes.json';", "import catalog from '../../shared/yard-sign-sizes.json' with { type: 'json' };"))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/admin-profit-estimate.ts src/lib/yard-sign-sizes.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Keep shared yard sign catalog compatible with native server module loading'
            git push origin HEAD:refs/heads/feat/yard-sign-sheet-sizes
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify pricing, quantities, promotions, supplier costs and legacy products
        run: |
          node --test netlify/functions/_shared/__tests__/yard-sign-sizes.test.cjs netlify/functions/__tests__/stripe-server-pricing.test.cjs netlify/functions/__tests__/get-orders-reporting.test.mjs netlify/functions/__tests__/payment-access-handler.test.mjs netlify/functions/__tests__/paypal-preview-containment.test.mjs netlify/functions/__tests__/security-data-integrity-regressions.test.mjs
          npx vitest run src/lib/__tests__/yard-sign-sizes.test.ts src/lib/__tests__/yard-sign-pricing.test.ts src/lib/yard-sign-first-order.test.ts src/lib/__tests__/admin-profit-estimate.test.ts src/lib/seo/__tests__/localPages.test.ts
      - name: Verify desktop and mobile designer flows
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.yard-sign-sizes.config.ts
      - name: Build full site
        run: npm run build
      - name: Remove temporary implementation workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/yard-sign-size-workbench.yml
          git add -A
          git commit -m 'Complete yard sign regression checks and remove temporary workbench'
          git push origin HEAD:refs/heads/feat/yard-sign-sheet-sizes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yard-sign-browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
