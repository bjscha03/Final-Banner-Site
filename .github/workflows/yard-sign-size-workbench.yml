name: Yard sign size workbench
on:
  push:
    branches: [feat/yard-sign-sheet-sizes]
    paths:
      - '.github/workflows/yard-sign-size-workbench.yml'
      - 'tests/browser/yard-sign-sizes.playwright.spec.ts'
      - 'playwright.yard-sign-sizes.config.ts'
permissions:
  contents: write
concurrency:
  group: yard-sign-size-workbench
  cancel-in-progress: false
jobs:
  workbench:
    if: github.ref == 'refs/heads/feat/yard-sign-sheet-sizes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/yard-sign-sheet-sizes
          fetch-depth: 1
      - name: Make browser fixture catalog loading compatible with Node
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/yard-sign-sheet-sizes'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser/yard-sign-sizes.playwright.spec.ts')
          text=p.read_text()
          text=text.replace("import catalog from '../../shared/yard-sign-sizes.json';", "import { readFileSync } from 'node:fs';\nconst catalog = JSON.parse(readFileSync(new URL('../../shared/yard-sign-sizes.json', import.meta.url), 'utf8'));")
          p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/yard-sign-sizes.playwright.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Load shared size catalog in browser regression tests on Node 20'
            git push origin HEAD:refs/heads/feat/yard-sign-sheet-sizes
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify pricing, quantities, promotions, supplier costs and legacy products
        run: |
          node --test netlify/functions/_shared/__tests__/yard-sign-sizes.test.cjs netlify/functions/__tests__/stripe-server-pricing.test.cjs
          npx vitest run src/lib/__tests__/yard-sign-sizes.test.ts src/lib/__tests__/yard-sign-pricing.test.ts src/lib/yard-sign-first-order.test.ts src/lib/__tests__/admin-profit-estimate.test.ts src/lib/seo/__tests__/localPages.test.ts
      - name: Verify desktop and mobile designer flows
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.yard-sign-sizes.config.ts
      - name: Build full site
        run: npm run build
      - name: Remove temporary implementation workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/yard-sign-size-workbench.yml
          git add -A
          git commit -m 'Complete yard sign regression checks and remove temporary workbench'
          git push origin HEAD:refs/heads/feat/yard-sign-sheet-sizes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yard-sign-browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
