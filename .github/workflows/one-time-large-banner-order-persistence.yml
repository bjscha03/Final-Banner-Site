name: One-time large-banner storefront patch

on:
  push:
    branches:
      - agent/automatic-large-banner-25-discount

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[large-banner-storefront-copy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out promotion branch
        uses: actions/checkout@v4
        with:
          ref: agent/automatic-large-banner-25-discount
          fetch-depth: 0

      - name: Patch direct storefront copy and promo UX
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch-large-banner-storefront.py
          python /tmp/patch-large-banner-storefront.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automatic-discount regression tests
        run: |
          node --test \
            netlify/functions/__tests__/automatic-large-banner-discount.test.cjs \
            netlify/functions/__tests__/recovery-discount-policy.test.cjs \
            netlify/functions/__tests__/september-promo-discount.test.cjs
          npx vitest run \
            src/lib/__tests__/largeBannerPromotion.test.ts \
            src/lib/__tests__/orderPricingLargeBannerPromotion.test.ts \
            src/lib/discount-resolver.recovery.test.ts \
            src/lib/__tests__/promoEngine.test.ts

      - name: Build storefront and server bundle
        run: npm run build

      - name: Commit storefront patch
        run: |
          if git diff --quiet -- src/pages/GoogleAdsBanner.tsx src/pages/Design.tsx; then
            echo "No storefront patch commit needed."
            exit 0
          fi
          git config user.name "Banners On The Fly Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/GoogleAdsBanner.tsx src/pages/Design.tsx
          git commit -m "Update large-banner promotion storefront UX [large-banner-storefront-copy]"
          git push origin HEAD:agent/automatic-large-banner-25-discount
