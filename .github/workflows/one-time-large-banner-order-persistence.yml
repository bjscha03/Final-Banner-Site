name: One-time large-banner order persistence patch

on:
  push:
    branches:
      - agent/automatic-large-banner-25-discount

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[large-banner-order-persistence]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out promotion branch
        uses: actions/checkout@v4
        with:
          ref: agent/automatic-large-banner-25-discount
          fetch-depth: 0

      - name: Patch authoritative order persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('netlify/functions/_shared/legacy/create-order-core.cjs')
          text = path.read_text()
          old = """  orderData.applied_discount_cents = totals.applied_discount_cents || 0;
          orderData.applied_discount_type = totals.applied_discount_type || 'none';
          if (totals.applied_discount_type === 'quantity') {
            const percentage = Math.round(totals.applied_discount_rate * 100);
            orderData.applied_discount_label = `Qty Discount (${percentage}% off)`;
          } else if (totals.applied_discount_type === 'promo') {
            orderData.applied_discount_label = `Promo: ${orderData.discountCode?.code || 'Applied'}`;
          } else {
            orderData.applied_discount_label = '';
          }
          return totals;
          """
          new = """  orderData.applied_discount_cents = totals.applied_discount_cents || 0;
          orderData.applied_discount_type = totals.applied_discount_type || 'none';
          orderData.applied_promotion_id = totals.applied_promotion_id || null;
          if (totals.applied_promotion_id) {
            // Automatic pricing is persisted through the existing discount_code
            // audit field, but it is not a claimable/single-use promo code.
            orderData.discountCode = {
              id: totals.applied_promotion_id,
              code: totals.applied_promotion_id,
              discountPercentage: Math.round((totals.applied_discount_rate || 0) * 100),
              discountAmountCents: null,
              source: 'automatic_large_banner_pricing',
              campaign: totals.applied_promotion_id,
              discountScope: 'qualifying_large_banner_lines',
              displayLabel: totals.applied_discount_label || 'Large Banner 25% Off',
            };
          }
          if (totals.applied_discount_type === 'quantity') {
            const percentage = Math.round(totals.applied_discount_rate * 100);
            orderData.applied_discount_label = `Qty Discount (${percentage}% off)`;
          } else if (totals.applied_discount_type === 'promo') {
            orderData.applied_discount_label = totals.applied_discount_label
              || `Promo: ${orderData.discountCode?.code || 'Applied'}`;
          } else {
            orderData.applied_discount_label = '';
          }
          return totals;
          """

          if new in text:
              print('Order persistence patch already present.')
          elif old not in text:
              raise SystemExit('Expected applyAuthoritativeOrderTotals block was not found; refusing an unsafe patch.')
          else:
              path.write_text(text.replace(old, new, 1))
              print('Patched automatic promotion id and label persistence.')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused automatic-discount tests
        run: |
          node --test netlify/functions/__tests__/automatic-large-banner-discount.test.cjs
          npx vitest run src/lib/__tests__/largeBannerPromotion.test.ts

      - name: Build storefront and server bundle
        run: npm run build

      - name: Commit authoritative persistence patch
        run: |
          if git diff --quiet -- netlify/functions/_shared/legacy/create-order-core.cjs; then
            echo "No persistence patch commit needed."
            exit 0
          fi
          git config user.name "Banners On The Fly Automation"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/_shared/legacy/create-order-core.cjs
          git commit -m "Persist automatic large-banner promotion metadata [large-banner-order-persistence]"
          git push origin HEAD:agent/automatic-large-banner-25-discount
