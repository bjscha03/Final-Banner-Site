name: Specialty catalog release checks
on:
  pull_request:
    paths:
      - 'shared/specialty-*'
      - 'src/lib/specialty*'
      - 'src/components/specialty/**'
      - 'src/pages/SpecialtyCatalog.tsx'
      - 'netlify/functions/__tests__/specialty-*'
      - 'scripts/test-specialty-browser.mjs'
      - '.github/workflows/specialty-pricing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pricing-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            install: chromium
            label: chromium
          - browser: chromium
            channel: chrome
            install: chrome
            label: chrome
          - browser: chromium
            channel: msedge
            install: msedge
            label: edge
          - browser: firefox
            install: firefox
            label: firefox
          - browser: webkit
            install: webkit
            label: safari-engine
          - browser: webkit
            install: webkit
            device: iPhone 15 Pro
            label: iphone
          - browser: webkit
            install: webkit
            device: iPad (gen 11)
            label: ipad
          - browser: chromium
            install: chromium
            device: Pixel 8
            label: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/generate-specialty-options.mjs --check
      - run: node --test netlify/functions/__tests__/specialty-products.test.cjs netlify/functions/__tests__/specialty-proposed-pricing.test.cjs netlify/functions/__tests__/specialty-quote-validation.test.cjs netlify/functions/__tests__/specialty-production-job.test.cjs
      - run: npx vitest run --config vitest.ai.config.ts src/lib/specialtyArtwork.test.ts src/lib/specialtyDiscount.test.ts src/store/cart.specialty.test.ts src/components/specialty/SpecialtyPreview.test.tsx src/pages/SpecialtyProductPage.test.tsx netlify/functions/__tests__/specialty-ai-layout.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.install }}
      - name: Resolve the local HTTPS fixture for all browser engines
        run: echo '127.0.0.1 deploy-preview-0--bof-local.netlify.app' | sudo tee -a /etc/hosts
      - name: Check catalog, accessories, custom sizes, cart repricing and mobile display
        run: node scripts/test-specialty-browser.mjs
        env:
          BOF_QA_BROWSER: ${{ matrix.browser }}
          BOF_QA_CHANNEL: ${{ matrix.channel }}
          BOF_QA_DEVICE: ${{ matrix.device }}
          BOF_QA_TEST_CHECKOUT: '1'
          BOF_QA_DIR: pricing-browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specialty-release-${{ matrix.label }}
          path: pricing-browser-results
          if-no-files-found: ignore
